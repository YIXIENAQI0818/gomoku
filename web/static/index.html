<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>WebSocket Echo 测试</title>
</head>
<body>
  <h1>WebSocket Echo 测试</h1>
  <p>
    <button id="connect">连接</button>
    <button id="close">断开</button>
  </p>
  <p>
    <input id="msg" placeholder="输入一条消息">
    <button id="send">发送</button>
  </p>
  <pre id="log"></pre>

  <script>
    let ws = null;
    const logEl = document.getElementById('log');
    function log(s) { logEl.textContent += s + '\n'; }

    document.getElementById('connect').onclick = () => {
      ws = new WebSocket('ws://localhost:8080');
      ws.onopen = () => log('[系统] 已连接');
      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          log('[收到] type=' + msg.type + '  data=' + JSON.stringify(msg.data));
        } catch (_) {
          log('[收到原始] ' + e.data);
        }
      };
      ws.onclose = () => log('[系统] 已断开');
      ws.onerror = () => log('[系统] 连接出错');
    };

    document.getElementById('send').onclick = () => {
      if (!ws || ws.readyState !== WebSocket.OPEN) { log('[系统] 尚未连接'); return; }
      const text = document.getElementById('msg').value;
      const msg = JSON.stringify({ type: 'echo', data: { text: text } });
      ws.send(msg);
      log('[发送] ' + msg);
    };

    document.getElementById('close').onclick = () => { if (ws) ws.close(); };
  </script>
</body>
</html>
